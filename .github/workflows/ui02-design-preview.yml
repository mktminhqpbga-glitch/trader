name: UI-02 Design Preview QA

on:
  workflow_dispatch:
  push:
    branches:
      - feat/aiCanvasStudioFoundation
    paths:
      - apps/web/src/main.ts
      - apps/web/src/designPreview/**
      - apps/web/public/designPreview/**
      - scripts/ui02-design-preview-qa.js
      - .github/workflows/ui02-design-preview.yml

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install exact lockfile dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck frontend and backend
        run: bun run typecheck
      - name: Build production application
        run: bun run build
      - name: Server regression
        run: bun test apps/server/src/index.test.ts
      - name: Install browser for live screenshots
        run: npx --yes playwright@1.65.1 install --with-deps chromium
      - name: Start preview Vite server without API or SQLite
        shell: bash
        run: |
          bun run dev:web > /tmp/ui02-design-vite.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:5173/?designPreview=A; then exit 0; fi
            sleep 1
          done
          cat /tmp/ui02-design-vite.log
          exit 1
      - name: Capture A and B in live Chromium
        run: |
          npx --yes playwright@1.65.1 cli -s=ui02preview open http://127.0.0.1:5173/?designPreview=A
          npx --yes playwright@1.65.1 cli -s=ui02preview run-code --filename scripts/ui02-design-preview-qa.js
      - name: Upload browser screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui02-design-preview-A-B
          path: |
            docs/evidence/ui02/review-A/*.png
            docs/evidence/ui02/review-B/*.png
            /tmp/ui02-design-vite.log
          if-no-files-found: warn
      - name: Commit exact Playwright screenshots on design branch
        if: success() && github.ref == 'refs/heads/feat/aiCanvasStudioFoundation'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/ui02/review-A/*.png docs/evidence/ui02/review-B/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(ui02): capture real A/B design preview screenshots [skip ci]"
            git fetch origin feat/aiCanvasStudioFoundation
            git rebase origin/feat/aiCanvasStudioFoundation
            git push origin HEAD:feat/aiCanvasStudioFoundation
          fi
