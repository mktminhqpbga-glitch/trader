name: UI-02 Design Preview QA

on:
  workflow_dispatch:
  push:
    branches:
      - feat/aiCanvasStudioFoundation
    paths:
      - apps/web/src/main.ts
      - apps/web/src/designPreview/**
      - apps/web/public/designPreview/**
      - scripts/ui02-design-preview-qa.js
      - .github/workflows/ui02-design-preview.yml

permissions:
  contents: read

concurrency:
  group: ui02-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install exact lockfile dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck frontend and backend
        run: bun run typecheck
      - name: Build production application
        run: bun run build
      - name: Server regression
        run: bun test apps/server/src/index.test.ts
      - name: Install browser for live screenshots
        run: npx --yes playwright@1.65.1 install --with-deps chromium
      - name: Start preview Vite server without API or SQLite
        shell: bash
        run: |
          bun run dev:web > /tmp/ui02-design-vite.log 2>&1 &
          vite_pid=$!
          for i in $(seq 1 45); do
            if curl --fail --silent --output /dev/null 'http://127.0.0.1:5173/?designPreview=A'; then exit 0; fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              cat /tmp/ui02-design-vite.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/ui02-design-vite.log
          exit 1
      - name: Capture A and B in live Chromium
        run: |
          mkdir -p docs/evidence/ui02/review-A docs/evidence/ui02/review-B
          npx --yes playwright@1.65.1 cli -s=ui02preview open 'http://127.0.0.1:5173/?designPreview=A'
          npx --yes playwright@1.65.1 cli -s=ui02preview run-code --filename scripts/ui02-design-preview-qa.js
      - name: Upload complete browser QA evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ui02-design-preview-A-B
          path: |
            docs/evidence/ui02/review-A/*.png
            docs/evidence/ui02/review-B/*.png
          if-no-files-found: error
      - name: Upload Vite failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui02-design-preview-vite-log
          path: /tmp/ui02-design-vite.log
          if-no-files-found: ignore
